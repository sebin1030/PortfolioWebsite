<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Hotel Cancellation 운영 대시보드</title>
  <desc id="desc">예약 취소율, 리드타임별 취소 위험, 모델 성능을 보여주는 데이터 분석 대시보드</desc>
  <rect width="1200" height="760" fill="#f7f7f9"/>
  <rect x="42" y="34" width="1116" height="692" rx="22" fill="#ffffff" stroke="#e4e4ec"/>
  <text x="82" y="88" fill="#202124" font-family="Pretendard, Arial, sans-serif" font-size="25" font-weight="700">Hotel Cancellation</text>
  <text x="82" y="119" fill="#77777f" font-family="Pretendard, Arial, sans-serif" font-size="14">예약 취소 위험 예측 · 운영 활용 전략</text>
  <rect x="979" y="62" width="135" height="38" rx="19" fill="#efedfb"/>
  <text x="1046" y="87" text-anchor="middle" fill="#7067b5" font-family="Pretendard, Arial, sans-serif" font-size="13" font-weight="600">OPERATIONS</text>

  <g transform="translate(82 158)">
    <rect width="245" height="112" rx="14" fill="#f8f8fb"/>
    <text x="22" y="30" fill="#77777f" font-family="Pretendard, Arial, sans-serif" font-size="13">총 예약 건수</text>
    <text x="22" y="76" fill="#202124" font-family="Pretendard, Arial, sans-serif" font-size="31" font-weight="700">118,902</text>
  </g>
  <g transform="translate(345 158)">
    <rect width="245" height="112" rx="14" fill="#f8f8fb"/>
    <text x="22" y="30" fill="#77777f" font-family="Pretendard, Arial, sans-serif" font-size="13">전체 취소율</text>
    <text x="22" y="76" fill="#7067b5" font-family="Pretendard, Arial, sans-serif" font-size="31" font-weight="700">37.1%</text>
  </g>
  <g transform="translate(608 158)">
    <rect width="245" height="112" rx="14" fill="#f8f8fb"/>
    <text x="22" y="30" fill="#77777f" font-family="Pretendard, Arial, sans-serif" font-size="13">평균 리드타임</text>
    <text x="22" y="76" fill="#202124" font-family="Pretendard, Arial, sans-serif" font-size="31" font-weight="700">104.3일</text>
  </g>
  <g transform="translate(871 158)">
    <rect width="243" height="112" rx="14" fill="#f8f8fb"/>
    <text x="22" y="30" fill="#77777f" font-family="Pretendard, Arial, sans-serif" font-size="13">모델 F1 / Recall</text>
    <text x="22" y="76" fill="#202124" font-family="Pretendard, Arial, sans-serif" font-size="28" font-weight="700">0.831 / 0.803</text>
  </g>

  <rect x="82" y="306" width="665" height="350" rx="16" fill="#ffffff" stroke="#e4e4ec"/>
  <text x="112" y="348" fill="#202124" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="700">리드타임별 취소 위험</text>
  <text x="112" y="376" fill="#77777f" font-family="Pretendard, Arial, sans-serif" font-size="12">예약일과 투숙일 사이가 길수록 취소율이 증가합니다</text>
  <line x1="136" y1="584" x2="700" y2="584" stroke="#dcdce5"/>
  <line x1="136" y1="412" x2="136" y2="584" stroke="#dcdce5"/>
  <line x1="136" y1="498" x2="700" y2="498" stroke="#eeeeF3"/>
  <line x1="136" y1="455" x2="700" y2="455" stroke="#eeeeF3"/>
  <text x="112" y="588" text-anchor="end" fill="#9a9aa2" font-family="Pretendard, Arial, sans-serif" font-size="11">0%</text>
  <text x="112" y="502" text-anchor="end" fill="#9a9aa2" font-family="Pretendard, Arial, sans-serif" font-size="11">50%</text>
  <text x="112" y="416" text-anchor="end" fill="#9a9aa2" font-family="Pretendard, Arial, sans-serif" font-size="11">100%</text>
  <rect x="190" y="546" width="94" height="38" rx="8" fill="#c9c6ee"/>
  <rect x="354" y="512" width="94" height="72" rx="8" fill="#a7a3dc"/>
  <rect x="518" y="464" width="94" height="120" rx="8" fill="#7067b5"/>
  <text x="237" y="535" text-anchor="middle" fill="#7067b5" font-family="Pretendard, Arial, sans-serif" font-size="12" font-weight="700">22%</text>
  <text x="401" y="501" text-anchor="middle" fill="#7067b5" font-family="Pretendard, Arial, sans-serif" font-size="12" font-weight="700">42%</text>
  <text x="565" y="453" text-anchor="middle" fill="#7067b5" font-family="Pretendard, Arial, sans-serif" font-size="12" font-weight="700">70%+</text>
  <text x="237" y="612" text-anchor="middle" fill="#77777f" font-family="Pretendard, Arial, sans-serif" font-size="12">0–50일</text>
  <text x="401" y="612" text-anchor="middle" fill="#77777f" font-family="Pretendard, Arial, sans-serif" font-size="12">51–300일</text>
  <text x="565" y="612" text-anchor="middle" fill="#77777f" font-family="Pretendard, Arial, sans-serif" font-size="12">300일 이상</text>

  <rect x="771" y="306" width="343" height="350" rx="16" fill="#efedfb"/>
  <text x="801" y="348" fill="#202124" font-family="Pretendard, Arial, sans-serif" font-size="17" font-weight="700">운영 우선순위</text>
  <text x="801" y="376" fill="#77777f" font-family="Pretendard, Arial, sans-serif" font-size="12">예측 결과를 다음 행동으로 연결</text>
  <circle cx="821" cy="431" r="8" fill="#7067b5"/><text x="846" y="437" fill="#202124" font-family="Pretendard, Arial, sans-serif" font-size="14" font-weight="600">고위험 예약</text><text x="846" y="460" fill="#77777f" font-family="Pretendard, Arial, sans-serif" font-size="12">선제 확인 · 보증 조건 검토</text>
  <circle cx="821" cy="505" r="8" fill="#a7a3dc"/><text x="846" y="511" fill="#202124" font-family="Pretendard, Arial, sans-serif" font-size="14" font-weight="600">중위험 예약</text><text x="846" y="534" fill="#77777f" font-family="Pretendard, Arial, sans-serif" font-size="12">리마인드 · 예약 정보 재확인</text>
  <circle cx="821" cy="579" r="8" fill="#c9c6ee"/><text x="846" y="585" fill="#202124" font-family="Pretendard, Arial, sans-serif" font-size="14" font-weight="600">일반 예약</text><text x="846" y="608" fill="#77777f" font-family="Pretendard, Arial, sans-serif" font-size="12">기본 운영 프로세스 유지</text>
</svg>
